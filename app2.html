<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SywisaFlow - Application de Gestion de Projet</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf5 100%);
        }
        
        .app-container {
            min-height: 100vh;
        }
        
        .app-header {
            background: white;
            box-shadow: 0 2px 10px rgba(0, 71, 171, 0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        
        .app-sidebar {
            width: 250px;
            background: white;
            height: calc(100vh - 70px);
            position: fixed;
            left: 0;
            top: 70px;
            box-shadow: 2px 0 10px rgba(0, 71, 171, 0.1);
            padding: 20px 0;
            overflow-y: auto;
            z-index: 999;
        }
        
        .app-main {
            margin-left: 250px;
            padding: 100px 30px 30px 30px;
            min-height: 100vh;
        }
        
        .menu-item {
            padding: 12px 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #555;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .menu-item:hover,
        .menu-item.active {
            background: linear-gradient(135deg, rgba(0, 71, 171, 0.1), rgba(0, 206, 209, 0.1), rgba(50, 205, 50, 0.1));
            color: #0047AB;
            border-left: 3px solid #0047AB;
        }
        
        .menu-item i {
            width: 20px;
        }
        
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .dashboard-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0, 71, 171, 0.1);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0047AB, #00CED1, #32CD32);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }
        
        .user-details h3 {
            margin-bottom: 5px;
            color: #333;
        }
        
        .user-details p {
            color: #666;
            font-size: 14px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(0, 71, 171, 0.1);
        }
        
        th {
            text-align: left;
            padding: 15px;
            background: linear-gradient(135deg, #0047AB, #00CED1);
            color: white;
            font-weight: 500;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: rgba(0, 71, 171, 0.05);
        }
        
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }
        
        .status-en-cours {
            background: rgba(0, 71, 171, 0.1);
            color: #0047AB;
        }
        
        .status-retard {
            background: rgba(255, 99, 71, 0.1);
            color: #ff6347;
        }
        
        .status-termine {
            background: rgba(50, 205, 50, 0.1);
            color: #32CD32;
        }
        
        .status-planifie {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
        }
        
        .btn-deconnexion {
            padding: 8px 20px;
            border-radius: 25px;
            background: transparent;
            border: 2px solid #ff4444;
            color: #ff4444;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-deconnexion:hover {
            background: #ff4444;
            color: white;
        }
        
        .welcome-message {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        
        .welcome-message span {
            background: linear-gradient(135deg, #0047AB, #00CED1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .btn-add {
            background: linear-gradient(135deg, #0047AB, #00CED1);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-edit {
            background: #ffc107;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }
        
        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .btn-view {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .modal-content .form-group {
            margin-bottom: 15px;
        }
        
        .modal-content label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        .modal-content input,
        .modal-content select,
        .modal-content textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
        }
        
        .modal-content button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .btn-save {
            background: linear-gradient(135deg, #0047AB, #00CED1);
            color: white;
            margin-right: 10px;
        }
        
        .btn-cancel {
            background: #6c757d;
            color: white;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(0, 71, 171, 0.1);
        }
        
        .stat-card i {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .stat-card h3 {
            font-size: 28px;
            color: #333;
        }
        
        .stat-card p {
            color: #666;
        }
        
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #0047AB, #00CED1);
            border-radius: 5px;
        }
        
        .section-title {
            margin: 30px 0 20px 0;
            color: #333;
        }
        
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-bar input,
        .filter-bar select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            flex: 1;
        }
        
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .project-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(0, 71, 171, 0.1);
        }
        
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .project-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        .project-actions {
            display: flex;
            gap: 5px;
        }
        
        @media (max-width: 768px) {
            .app-sidebar {
                width: 100%;
                height: auto;
                position: relative;
                top: 0;
            }
            .app-main {
                margin-left: 0;
            }
            .app-header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <img src="images/logsans.png" alt="SywisaFlow" style="width: 35px; height: 35px;">
                <span style="font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #0047AB, #00CED1, #32CD32); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SywisaFlow</span>
            </div>

            <div class="user-info" id="userInfoDisplay">
                <!-- Rempli par JavaScript -->
            </div>

            <button class="btn-deconnexion" id="btnDeconnexion">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </button>
        </header>

        <aside class="app-sidebar">
            <div class="menu-item active" data-section="dashboard">
                <i class="fas fa-home"></i> Tableau de bord
            </div>
            <div class="menu-item" data-section="projets">
                <i class="fas fa-project-diagram"></i> Projets
            </div>
            <div class="menu-item" data-section="taches">
                <i class="fas fa-tasks"></i> Tâches
            </div>
            <div class="menu-item" data-section="equipe">
                <i class="fas fa-users"></i> Équipe
            </div>
            <div class="menu-item" data-section="calendrier">
                <i class="fas fa-calendar"></i> Calendrier
            </div>
            <div class="menu-item" data-section="statistiques">
                <i class="fas fa-chart-line"></i> Statistiques
            </div>
            <div class="menu-item" data-section="parametres">
                <i class="fas fa-cog"></i> Paramètres
            </div>
        </aside>

        <main class="app-main" id="mainContent">
            <!-- Le contenu sera chargé dynamiquement -->
        </main>
    </div>

    <!-- Modal pour ajouter/modifier un projet -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Ajouter un projet</h2>
            <form id="projectForm">
                <input type="hidden" id="projectId">
                <div class="form-group">
                    <label>Nom du projet</label>
                    <input type="text" id="projectName" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="projectDescription" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Date de début</label>
                    <input type="date" id="projectStartDate" required>
                </div>
                <div class="form-group">
                    <label>Date de fin</label>
                    <input type="date" id="projectEndDate" required>
                </div>
                <div class="form-group">
                    <label>Statut</label>
                    <select id="projectStatus" required>
                        <option value="planifie">Planifié</option>
                        <option value="en-cours">En cours</option>
                        <option value="termine">Terminé</option>
                        <option value="retard">En retard</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Progression (%)</label>
                    <input type="number" id="projectProgress" min="0" max="100" required>
                </div>
                <button type="submit" class="btn-save">Enregistrer</button>
                <button type="button" class="btn-cancel" onclick="closeProjectModal()">Annuler</button>
            </form>
        </div>
    </div>

    <!-- Modal pour ajouter/modifier une tâche -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h2 id="taskModalTitle">Ajouter une tâche</h2>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label>Titre de la tâche</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="taskDescription" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Projet associé</label>
                    <select id="taskProject" required>
                        <option value="">Sélectionner un projet</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Assigné à</label>
                    <select id="taskAssignee">
                        <option value="">Non assigné</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date d'échéance</label>
                    <input type="date" id="taskDueDate" required>
                </div>
                <div class="form-group">
                    <label>Statut</label>
                    <select id="taskStatus" required>
                        <option value="a-faire">À faire</option>
                        <option value="en-cours">En cours</option>
                        <option value="termine">Terminé</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Priorité</label>
                    <select id="taskPriority" required>
                        <option value="basse">Basse</option>
                        <option value="moyenne">Moyenne</option>
                        <option value="haute">Haute</option>
                    </select>
                </div>
                <button type="submit" class="btn-save">Enregistrer</button>
                <button type="button" class="btn-cancel" onclick="closeTaskModal()">Annuler</button>
            </form>
        </div>
    </div>

    <script>
        // Données initiales
        let projects = JSON.parse(localStorage.getItem('projects')) || [{
            id: 1,
            name: 'Site Web E-commerce',
            description: 'Développement d\'un site e-commerce complet',
            startDate: '2026-03-01',
            endDate: '2026-04-30',
            status: 'en-cours',
            progress: 65
        }, {
            id: 2,
            name: 'Application Mobile',
            description: 'Application mobile pour iOS et Android',
            startDate: '2026-02-15',
            endDate: '2026-05-15',
            status: 'en-cours',
            progress: 40
        }, {
            id: 3,
            name: 'Refonte Design',
            description: 'Refonte complète du design du site',
            startDate: '2026-01-10',
            endDate: '2026-03-10',
            status: 'retard',
            progress: 80
        }, {
            id: 4,
            name: 'Campagne Marketing',
            description: 'Campagne de marketing digital',
            startDate: '2026-04-01',
            endDate: '2026-04-30',
            status: 'planifie',
            progress: 0
        }];

        let tasks = JSON.parse(localStorage.getItem('tasks')) || [{
            id: 1,
            title: 'Créer la base de données',
            description: 'Mise en place de la structure de la base de données',
            projectId: 1,
            assignee: 'Jean Dupont',
            dueDate: '2026-03-15',
            status: 'termine',
            priority: 'haute'
        }, {
            id: 2,
            title: 'Développer l\'interface utilisateur',
            description: 'Création des composants UI',
            projectId: 1,
            assignee: 'Marie Martin',
            dueDate: '2026-03-30',
            status: 'en-cours',
            priority: 'haute'
        }, {
            id: 3,
            title: 'Tests de l\'application',
            description: 'Tests fonctionnels et de performance',
            projectId: 2,
            assignee: 'Pierre Durand',
            dueDate: '2026-04-15',
            status: 'a-faire',
            priority: 'moyenne'
        }];

        let teamMembers = JSON.parse(localStorage.getItem('teamMembers')) || [{
            id: 1,
            name: 'Jean Dupont',
            role: 'Développeur',
            email: 'jean@example.com'
        }, {
            id: 2,
            name: 'Marie Martin',
            role: 'Designer',
            email: 'marie@example.com'
        }, {
            id: 3,
            name: 'Pierre Durand',
            role: 'Testeur',
            email: 'pierre@example.com'
        }, {
            id: 4,
            name: 'Sophie Bernard',
            role: 'Chef de projet',
            email: 'sophie@example.com'
        }];

        // Sauvegarder les données
        function saveData() {
            localStorage.setItem('projects', JSON.stringify(projects));
            localStorage.setItem('tasks', JSON.stringify(tasks));
            localStorage.setItem('teamMembers', JSON.stringify(teamMembers));
        }

        // Variables globales
        let currentProjectId = null;
        let currentTaskId = null;

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            // Vérifier si l'utilisateur est connecté
            const isLoggedIn = sessionStorage.getItem('isLoggedIn');

            if (!isLoggedIn || isLoggedIn !== 'true') {
                window.location.href = 'application.html';
                return;
            }

            // Afficher les informations utilisateur
            displayUserInfo();

            // Charger la section dashboard par défaut
            loadSection('dashboard');

            // Gestionnaire de menu
            document.querySelectorAll('.menu-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    loadSection(this.dataset.section);
                });
            });

            // Gestion de la déconnexion
            document.getElementById('btnDeconnexion').addEventListener('click', function() {
                if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
                    sessionStorage.clear();
                    alert('Déconnexion réussie !');
                    window.location.href = 'application.html';
                }
            });
        });

        // Afficher les informations utilisateur
        function displayUserInfo() {
            const nom = sessionStorage.getItem('userNom') || 'Utilisateur';
            const prenom = sessionStorage.getItem('userPrenom') || '';
            const email = sessionStorage.getItem('userEmail') || 'email@exemple.com';

            const nomComplet = prenom ? `${prenom} ${nom}` : nom;
            const initiale = prenom ? prenom.charAt(0).toUpperCase() : nom.charAt(0).toUpperCase();

            document.getElementById('userInfoDisplay').innerHTML = `
                <div class="avatar">${initiale}</div>
                <div class="user-details">
                    <h3>${nomComplet}</h3>
                    <p>${email}</p>
                </div>
            `;
        }

        // Charger une section
        function loadSection(section) {
            const content = document.getElementById('mainContent');

            switch (section) {
                case 'dashboard':
                    content.innerHTML = getDashboardHTML();
                    break;
                case 'projets':
                    content.innerHTML = getProjectsHTML();
                    break;
                case 'taches':
                    content.innerHTML = getTasksHTML();
                    break;
                case 'equipe':
                    content.innerHTML = getTeamHTML();
                    break;
                case 'statistiques':
                    content.innerHTML = getStatisticsHTML();
                    break;
                case 'calendrier':
                    content.innerHTML = getCalendarHTML();
                    break;
                case 'parametres':
                    content.innerHTML = getSettingsHTML();
                    break;
            }
        }

        // HTML pour le tableau de bord
        function getDashboardHTML() {
            const activeProjects = projects.filter(p => p.status === 'en-cours').length;
            const completedProjects = projects.filter(p => p.status === 'termine').length;
            const delayedTasks = tasks.filter(t => {
                const taskDate = new Date(t.dueDate);
                const today = new Date();
                return taskDate < today && t.status !== 'termine';
            }).length;
            const totalTasks = tasks.length;

            return `
                <div class="welcome-message" id="welcomeMessage">
                    Bonjour <span>${sessionStorage.getItem('userPrenom') || sessionStorage.getItem('userNom') || 'Utilisateur'}</span> !
                </div>
                
                <div class="stats-container">
                    <div class="stat-card">
                        <i class="fas fa-project-diagram" style="color: #0047AB;"></i>
                        <h3>${projects.length}</h3>
                        <p>Total Projets</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-spinner" style="color: #00CED1;"></i>
                        <h3>${activeProjects}</h3>
                        <p>Projets en cours</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-check-circle" style="color: #32CD32;"></i>
                        <h3>${completedProjects}</h3>
                        <p>Projets terminés</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-tasks" style="color: #ffc107;"></i>
                        <h3>${totalTasks}</h3>
                        <p>Tâches totales</p>
                    </div>
                </div>

                <h2 class="section-title">Progression globale</h2>
                <div class="chart-container">
                    <div style="margin-bottom: 15px;">
                        <div style="display: flex; justify-content: space-between;">
                            <span>Progression moyenne</span>
                            <span>${Math.round(projects.reduce((acc, p) => acc + p.progress, 0) / projects.length) || 0}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.round(projects.reduce((acc, p) => acc + p.progress, 0) / projects.length) || 0}%"></div>
                        </div>
                    </div>
                </div>

                <h2 class="section-title">Projets récents</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Projet</th>
                            <th>Date de fin</th>
                            <th>Statut</th>
                            <th>Progression</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${projects.slice(0, 5).map(project => `
                            <tr>
                                <td>${project.name}</td>
                                <td>${formatDate(project.endDate)}</td>
                                <td><span class="status-badge status-${project.status}">${getStatusLabel(project.status)}</span></td>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 10px;">
                                        <div class="progress-bar" style="width: 100px;">
                                            <div class="progress-fill" style="width: ${project.progress}%"></div>
                                        </div>
                                        ${project.progress}%
                                    </div>

                closeProjectModal();
                loadSection('projets');

                    // Update
                    const index = tasks.findIndex(t => t.id === taskData.id);
                    if (index !== -1) {
                        tasks[index] = taskData;
                    }
                } else {
                    // Create
                    tasks.push(taskData);
                }

                saveData();
                closeTaskModal();
                loadSection('taches');
            });
        }

        function editTask(id) {
            openTaskModal(id);
        }

        function deleteTask(id) {
            if (confirm('Voulez-vous vraiment supprimer cette tâche ?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveData();
                loadSection('taches');
            }
        }

        // Filtres
        function filterProjects() {
            const search = document.getElementById('projectSearch').value.toLowerCase();
            const status = document.getElementById('projectStatusFilter').value;
            
            document.querySelectorAll('#projectGrid .project-card').forEach(card => {
                const name = card.dataset.name;
                const cardStatus = card.dataset.status;
                const matchesSearch = name.includes(search);
                const matchesStatus = !status || cardStatus === status;
                
                card.style.display = matchesSearch && matchesStatus ? 'block' : 'none';
            });
        }

        function filterTasks() {
            const search = document.getElementById('taskSearch').value.toLowerCase();
            const status = document.getElementById('taskStatusFilter').value;
            const priority = document.getElementById('taskPriorityFilter').value;
            
            document.querySelectorAll('#taskTableBody tr').forEach(row => {
                const title = row.dataset.title;
                const rowStatus = row.dataset.status;
                const rowPriority = row.dataset.priority;
                const matchesSearch = title.includes(search);
                const matchesStatus = !status || rowStatus === status;
                const matchesPriority = !priority || rowPriority === priority;
                
                row.style.display = matchesSearch && matchesStatus && matchesPriority ? '' : 'none';
            });
        }

        // Gestion des membres
        function openMemberModal(memberId = null) {
            const name = prompt('Nom du membre:');
            if (name) {
                const role = prompt('Rôle:');
                const email = prompt('Email:');
                if (role && email) {
                    const newMember = {
                        id: memberId || Date.now(),
                        name: name,
                        role: role,
                        email: email
                    };
                    
                    if (memberId) {
                        const index = teamMembers.findIndex(m => m.id === memberId);
                        if (index !== -1) {
                            teamMembers[index] = newMember;
                        }
                    } else {
                        teamMembers.push(newMember);
                    }
                    
                    saveData();
                    loadSection('equipe');
                }
            }
        }

        function editMember(id) {
            openMemberModal(id);
        }

        function deleteMember(id) {
            if (confirm('Voulez-vous vraiment supprimer ce membre ?')) {
                teamMembers = teamMembers.filter(m => m.id !== id);
                saveData();
                loadSection('equipe');
            }
        }

        // Gestion des données
        function clearAllData() {
            projects = [];
            tasks = [];
            teamMembers = [];
            saveData();
            loadSection('dashboard');
        }

        function exportData() {
            const data = {
                projects: projects,
                tasks: tasks,
                teamMembers: teamMembers,
                exportDate: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sywisaflow-export-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Initialiser les données
        saveData();
    </script>
</body>

</html>
